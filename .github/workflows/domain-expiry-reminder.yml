name: zgland.com domain expiry reminder

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/domain-expiry-reminder.yml"
      - "scripts/domain_expiry_reminder.py"
  schedule:
    # Every day at 10:15 China Standard Time. The script only sends on reminder dates.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test reminder email now"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  check-domain-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check expiry and send reminder when due
        id: reminder
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.send_test }}" == "true" ]]; then
            python3 scripts/domain_expiry_reminder.py --send-test --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/domain_expiry_reminder.py --github-output "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub notification and email fallback
        if: steps.reminder.outputs.should_notify == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.reminder.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.reminder.outputs.issue_body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ISSUE_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: process.env.ISSUE_BODY,
                assignees: [owner]
              });
            }
