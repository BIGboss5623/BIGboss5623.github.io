name: zgland.com domain expiry reminder

on:
  # Automatic monthly / final-30-day emails now use the existing server's
  # persistent outbox. Keep this workflow for explicit manual diagnostics only.
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test reminder email now"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  check-domain-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check expiry and send reminder when due
        id: reminder
        shell: bash
        run: |
          if [[ "${{ inputs.send_test }}" == "true" ]]; then
            python3 scripts/domain_expiry_reminder.py --send-test --github-output "$GITHUB_OUTPUT"
          else
            python3 -c "from scripts.domain_expiry_reminder import get_expiry; expiry,source=get_expiry(); print('domain=zgland.com expiry='+expiry.isoformat()+' source='+source+'; scheduled mail is handled by the server')"
          fi

      - name: Create GitHub notification and email fallback
        if: steps.reminder.outputs.should_notify == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.reminder.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.reminder.outputs.issue_body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ISSUE_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: process.env.ISSUE_BODY,
                assignees: [owner]
              });
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body: process.env.ISSUE_BODY,
                assignees: [owner]
              });
            }
